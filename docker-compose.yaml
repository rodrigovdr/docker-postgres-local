services:
  db:
    image: postgres:${DB_IMAGE_TAG}
    container_name: postgres_db
    restart: always
    command: >
      postgres
      -c "app.jwt_secret=${PGRST_JWT_SECRET}"
      -c "app.api_master_key=${API_MASTER_KEY}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data # Named volume for Win/Mac performance
      - ./init-scripts:/docker-entrypoint-initdb.d # PostgreSQL executes this on initial boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_IMAGE_TAG}
    container_name: pgadmin_interface
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PW}
      # Essential for Docker Desktop (Windows/Mac)
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: '10'
      # Tells PgAdmin that it is in a subpath
      PGADMIN_LISTEN_ADDRESS: '0.0.0.0'
    #ports:
    #  - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  api:
    image: postgrest/postgrest:${API_IMAGE_TAG}
    container_name: postgrest_api
    restart: always
    environment:
      PGRST_DB_URI: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PGRST_DB_SCHEMA: public
      # Changed from ${DB_USER} to 'web_anon'
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://localhost/api/
    #ports:
    #  - "${API_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  swagger:
    image: swaggerapi/swagger-ui
    container_name: swagger_ui
    environment:
      #API_URL: http://localhost:${API_PORT}/
      # Swagger should load API definitions through the Nginx proxy
      API_URL: https://localhost/api/
    #ports:
    #  - "${SWAGGER_PORT}:8080"
    networks:
      - app-network

  backups:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres_backup
    restart: always
    user: root # Prevents permission errors in shared folders on the host
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS}
      # Name format compatible with Windows (no forbidden characters)
      POSTGRES_BACKUP_NAME: "backup-$${POSTGRES_DB}-$${DATE}.sql.gz"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_ssl:/etc/nginx/ssl:ro
      - ./www:/usr/share/nginx/html
    depends_on:
      - pgadmin
      - api
      - swagger
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
  pgadmin_data: